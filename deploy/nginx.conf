# In front of both API instances. Requests go round robin; an SDK stream stays on the instance
# that took it until that instance shuts down and ends it, and the SDK reconnects to the other.
# The dashboard is served from here too, under /dashboard/, so it and the API share an origin.

# The whole configuration rather than a conf.d snippet, for the connection limit: the stock file
# allows each worker 1,024, and every SDK stream takes two, one from the SDK and one to the API.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 16384;
}

http {
    access_log /var/log/nginx/access.log;

    # For the dashboard's files: a script sent as text/plain is refused under nosniff.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's DNS: instance addresses are looked up again as containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # max_fails=0: a refused connection is retried on the other instance straight away, so
    # neither is ever taken out of rotation. With the default, an instance that refused one
    # connection while it restarted stayed out for 10 s after it was back, and two restarts in a
    # row left none.
    upstream flagstaff_api {
        zone flagstaff_api 64k;
        server api-1:8000 resolve max_fails=0;
        server api-2:8000 resolve max_fails=0;
        keepalive 16;
    }

    # A caller's own request id is passed on. Without one, nginx's id goes to the API, so both
    # logs name the request the same way.
    map $http_x_request_id $upstream_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # The dashboard's assets are named by a hash of their content, so they can be kept for good;
    # the page that names them is checked every time. API responses keep their own headers.
    map $uri $dashboard_cache_control {
        ~^/dashboard/assets/ "public, max-age=31536000, immutable";
        ~^/dashboard/        "no-cache";
        default              "";
    }

    # The dashboard loads nothing from anywhere else, and nothing may frame it.
    map $uri $dashboard_csp {
        ~^/dashboard/ "default-src 'self'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
        default       "";
    }

    server {
        listen 8080;

        # nginx leaves out a header whose value is empty, which is how these stay off the API.
        # Caching only applies to successful answers, so a missing asset isn't remembered.
        add_header Cache-Control $dashboard_cache_control;
        add_header Content-Security-Policy $dashboard_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            return 302 /dashboard/;
        }

        location = /dashboard {
            return 301 /dashboard/;
        }

        # Its pages are routes inside the app, so every path that isn't a file gets index.html.
        location /dashboard/ {
            root /usr/share/nginx;
            try_files $uri /dashboard/index.html;
        }

        # A missing asset is a 404, not index.html served as script.
        location /dashboard/assets/ {
            root /usr/share/nginx;
            try_files $uri =404;
        }

        # Prometheus scrapes each instance directly; metrics never leave through the proxy.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://flagstaff_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $upstream_request_id;
            # Well past the API's 15 s keep-alive comments, so a quiet SDK stream isn't cut off.
            proxy_read_timeout 60s;
            # An instance that is shutting down refuses connections; the request goes to the other.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
