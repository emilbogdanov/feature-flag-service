[project]
name = "flagstaff-loadtest"
version = "0.1.0"
description = "Load tests for a running Flagstaff stack: flag evaluation, ruleset polling and stream fan-out."
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Emil Bogdanov" }]
dependencies = [
    "flagstaff",
    "httpx>=0.28",
]

[project.scripts]
flagstaff-load = "flagstaff_load.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
]

# Evaluation is measured through the SDK as an app would use it.
[tool.uv.sources]
flagstaff = { path = "../sdk", editable = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flagstaff_load"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "PL", "RUF", "S", "T20", "DTZ", "PT", "TRY", "ERA", "FBT", "ARG", "PIE", "TC",
]
ignore = [
    "TRY003",   # exception messages are composed where the invalid value is known
]

[tool.ruff.lint.per-file-ignores]
# asserts, literal expectations
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
