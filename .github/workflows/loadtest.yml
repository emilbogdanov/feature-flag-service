name: loadtest

on:
  push:
    paths: &loadtest-paths
      - "loadtest/**"
      # The load generator drives the SDK, so an SDK change can break it.
      - "sdk/**"
      - ".github/workflows/loadtest.yml"
  pull_request:
    paths: *loadtest-paths

permissions:
  contents: read

concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: loadtest

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: loadtest/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
