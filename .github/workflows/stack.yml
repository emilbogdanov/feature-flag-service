name: stack

on:
  push:
    paths: &stack-paths
      - "backend/**"
      - "sdk/**"
      - "deploy/**"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/stack.yml"
  pull_request:
    paths: *stack-paths

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

# The image, the compose file and nginx's config checked together: the stack is built and started
# as anyone would start it, then tested from outside.
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Start the stack
        run: docker compose up --build --wait

      - name: Install the test dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Test the stack
        working-directory: backend
        env:
          FLAGSTAFF_STACK_URL: http://localhost:8080
        run: uv run pytest tests/stack

      - name: Show the stack's logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
