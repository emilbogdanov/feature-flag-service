name: stack

on:
  push:
    paths: &stack-paths
      - "backend/**"
      - "sdk/**"
      - "frontend/**"
      - "deploy/**"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/stack.yml"
  pull_request:
    paths: *stack-paths

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

# The images, the compose file and nginx's config checked together: the stack is built and
# started as anyone would start it, then tested from outside, the dashboard in a real browser.
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Start the stack
        run: docker compose up --build --wait

      - name: Install the test dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Test the stack
        working-directory: backend
        env:
          FLAGSTAFF_STACK_URL: http://localhost:8080
        run: uv run pytest tests/stack

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dashboard's test dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test the dashboard end to end
        working-directory: frontend
        env:
          FLAGSTAFF_STACK_URL: http://localhost:8080
        run: |
          FLAGSTAFF_ADMIN_KEY="$(docker compose exec -T api-1 flagstaff-server create-admin-key --name "e2e")"
          export FLAGSTAFF_ADMIN_KEY
          npm run e2e

      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Show the stack's logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
