name: sdk

on:
  push:
    paths: &sdk-paths
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths: *sdk-paths

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The SDK runs inside other people's apps, so it is tested on every Python it claims to support.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: sdk/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
