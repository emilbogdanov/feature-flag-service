name: frontend

on:
  push:
    paths: &frontend-paths
      - "frontend/**"
      # The dashboard's API types are generated from the backend, so a backend change can break it.
      - "backend/**"
      - "sdk/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths: *frontend-paths

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate the API types
        run: npm run generate:api

      - name: Check they match the committed ones
        run: |
          if ! git diff --exit-code -- src/api/schema.ts; then
            echo "::error file=frontend/src/api/schema.ts::out of date with the API; run npm run generate:api and commit the result"
            exit 1
          fi
