[project]
name = "flagstaff"
version = "0.1.0"
description = "Python SDK for Flagstaff feature flags: rules evaluated in-process, kept current over server-sent events."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# A copy of the repository's license, so the package carries it wherever it is installed.
license-files = ["LICENSE"]
authors = [{ name = "Emil Bogdanov" }]
keywords = ["feature flags", "feature toggles", "rollout", "server-sent events"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Repository = "https://github.com/emilbogdanov/feature-flag-service"
Documentation = "https://github.com/emilbogdanov/feature-flag-service/tree/main/sdk#readme"
Issues = "https://github.com/emilbogdanov/feature-flag-service/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "PL", "RUF", "S", "T20", "DTZ", "PT", "TRY", "ERA", "FBT", "ARG", "PIE", "TC",
]
ignore = [
    "TRY003",   # exception messages are composed where the invalid value is known
    "PLR0913",  # the clients take their options as keyword-only arguments, all of them optional
]

[tool.ruff.lint.per-file-ignores]
# asserts, literal expectations, seeded randomness for test data
"tests/**" = ["S101", "PLR2004", "S311"]

[tool.mypy]
strict = true
# The oldest supported Python, so nothing newer slips into the published package.
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
